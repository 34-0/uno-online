<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO Online</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:radial-gradient(circle at 50% 10%,#29326e,#11162f 65%,#090c1b);color:#fff;min-height:100vh}
button,input{font:inherit}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.panel{width:min(560px,94vw);background:#111632ee;border:1px solid #535e93;border-radius:24px;padding:28px;box-shadow:0 25px 80px #0008}.logo{text-align:center;font-size:68px;font-weight:1000;font-style:italic;color:#fff;text-shadow:4px 5px 0 #e51d2a,-2px -2px #ffd400}.sub{text-align:center;color:#c1c7ea}.field{width:100%;padding:14px;border-radius:13px;border:1px solid #596394;background:#0c1129;color:#fff;margin:7px 0 10px;outline:0}.row{display:flex;gap:10px}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #0004}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:linear-gradient(135deg,#ff3930,#ff9100);color:#fff}.secondary{background:#394372;color:#fff}.green{background:#18b77a;color:#071b13}.hidden{display:none!important}
#game{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:9px;padding:12px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#111632dd;border:1px solid #4b5686;border-radius:18px;padding:10px 14px}.brand{font-size:27px;font-weight:1000;font-style:italic;color:#ffd23e}.pills{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pill{background:#252d5a;border:1px solid #4b5688;border-radius:99px;padding:7px 11px;font-size:13px}
.table{position:relative;min-height:590px;background:radial-gradient(ellipse at center,#17533b,#0b3028 55%,#071b1a);border:9px solid #3e2c1e;border-radius:38%/24%;box-shadow:inset 0 0 0 2px #967243,inset 0 0 100px #0009;display:flex;align-items:center;justify-content:center}.center{display:flex;gap:22px;align-items:center}.deck,.card{width:84px;height:120px;border-radius:13px;border:3px solid #fff;box-shadow:0 8px 18px #0008}.deck{background:repeating-linear-gradient(45deg,#202b66 0 7px,#394789 7px 14px);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:1000;font-style:italic;cursor:pointer}.card{position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:1000;text-shadow:2px 2px 2px #0008}.red{background:#e92b35}.yellow{background:#f2c400;color:#111}.green{background:#16a968}.blue{background:#287be0}.wild{background:linear-gradient(135deg,#e52d38 0 25%,#f0c400 25% 50%,#16a968 50% 75%,#287be0 75%)}.oval{position:absolute;width:65%;height:72%;border:3px solid #ffffffaa;border-radius:50%;transform:rotate(-30deg)}.v{z-index:2}.player{position:absolute;background:#10162ddd;border:1px solid #59608a;border-radius:16px;padding:7px 12px;text-align:center;min-width:125px}.avatar{font-size:27px}.name{font-weight:900}.count{font-size:12px;color:#b8c0e8}.p0{bottom:12px;left:50%;transform:translateX(-50%)}.p1{top:13px;left:50%;transform:translateX(-50%)}.p2{left:12px;top:50%;transform:translateY(-50%)}.p3{right:12px;top:50%;transform:translateY(-50%)}.active{border-color:#ffd34d;box-shadow:0 0 25px #ffd34d55}.turn{position:absolute;bottom:55px;background:#0008;border:1px solid #ffffff2b;border-radius:99px;padding:8px 14px;font-size:13px}
.handbox{background:#111632e8;border:1px solid #4b5686;border-radius:18px;padding:10px}.hand{display:flex;justify-content:center;align-items:flex-end;min-height:125px;overflow-x:auto;direction:ltr;padding:4px}.mycard{margin:0 -7px;cursor:pointer;transition:.16s}.mycard:hover{transform:translateY(-15px);z-index:4}.actions{text-align:center;margin-top:7px}.note{text-align:center;color:#aeb7df;font-size:12px}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10}.modalbox{background:#151a3b;border:1px solid #59618e;border-radius:20px;padding:20px;width:min(410px,92vw);text-align:center}.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cb{padding:14px;border:0;border-radius:12px;font-weight:900}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#050714ee;border:1px solid #6670a5;padding:11px 18px;border-radius:99px;z-index:20;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:800px){.table{min-height:470px}.card,.deck{width:70px;height:100px}.player{transform:scale(.82)}}
</style></head>
<body>
<div id="login" class="screen"><div class="panel">
<div class="logo">UNO</div><p class="sub">اللعب أونلاين مع أصدقائك — أنشئ غرفة أو انضم برمز</p>
<input id="name" class="field" maxlength="18" placeholder="اسمك" value="راشد">
<div class="row"><button id="createBtn" class="btn primary" style="flex:1" onclick="createRoom()">إنشاء غرفة</button><button id="joinBtn" class="btn secondary" style="flex:1" onclick="joinRoom()">انضمام</button></div>
<input id="room" class="field" maxlength="8" placeholder="رمز الغرفة" style="margin-top:12px;text-transform:uppercase">
<p id="conn" class="note">الاتصال: جاري الاتصال...</p>
<p class="note">إذا فتحت الملف مباشرة لن يعمل الأونلاين. شغّل <b>تشغيل_اللعبة.bat</b> أولاً.</p>
</div></div>

<div id="lobby" class="screen hidden"><div class="panel">
<div class="logo" style="font-size:54px">UNO</div><h2 style="text-align:center">غرفة اللعب</h2>
<div style="text-align:center;font-size:42px;font-weight:1000;letter-spacing:5px" id="roomCode">----</div>
<p class="sub">أرسل الرمز لأصدقائك</p><div id="players"></div>
<button id="startBtn" class="btn primary" style="width:100%;margin-top:15px" onclick="startOnline()">ابدأ اللعبة</button>
<button class="btn secondary" style="width:100%;margin-top:10px" onclick="leave()">خروج</button>
</div></div>

<div id="game" class="hidden">
<div class="top"><div class="brand">UNO ONLINE</div><div class="pills"><span class="pill">👤 <b id="me"></b></span><span class="pill">غرفة: <b id="codeTop"></b></span><button class="btn secondary" onclick="leave()">خروج</button></div></div>
<main class="table"><div id="playersBoard"></div><div class="center"><div class="deck" onclick="draw()">UNO</div><div id="discard"></div></div><div class="turn" id="turn"></div></main>
<section class="handbox"><div class="hand" id="hand"></div><div class="actions"><button class="btn secondary" onclick="draw()">سحب ورقة</button> <button class="btn green" onclick="uno()">UNO!</button></div><div class="note" id="status"></div></section>
</div>

<div id="colorModal" class="modal hidden"><div class="modalbox"><h2>اختر اللون</h2><div class="colors">
<button class="cb" style="background:#e92b35;color:#fff" onclick="chooseColor('red')">أحمر</button><button class="cb" style="background:#f2c400" onclick="chooseColor('yellow')">أصفر</button><button class="cb" style="background:#16a968;color:#fff" onclick="chooseColor('green')">أخضر</button><button class="cb" style="background:#287be0;color:#fff" onclick="chooseColor('blue')">أزرق</button>
</div></div></div><div id="toast" class="toast"></div>

<script>
let ws=null, connected=false, me='',room='',isHost=false,state=null;
const $=id=>document.getElementById(id);
function wsURL(){return (location.protocol==='https:'?'wss://':'ws://')+location.host}
function connect(){
 try{ws=new WebSocket(wsURL())}catch(e){setConn('تعذر إنشاء الاتصال');return}
 ws.onopen=()=>{connected=true;setConn('الاتصال: متصل ✓');$('createBtn').disabled=false;$('joinBtn').disabled=false};
 ws.onclose=()=>{connected=false;setConn('الاتصال: انقطع — شغّل الخادم ثم أعد فتح الصفحة');$('createBtn').disabled=true;$('joinBtn').disabled=true};
 ws.onerror=()=>setConn('خطأ في الاتصال');
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
   if(m.type==='error'){toast(m.message);return}
   if(m.type==='room'){room=m.room;isHost=m.host;showLobby(m)}
   if(m.type==='started'){showGame();render(m.state)}
   if(m.type==='state'){render(m.state)}
 };
}
function setConn(t){$('conn').textContent=t}
function send(type,data={}){
 if(!connected){toast('الاتصال غير جاهز. شغّل اللعبة عبر تشغيل_اللعبة.bat');return false}
 ws.send(JSON.stringify({type,...data}));return true
}
function createRoom(){me=$('name').value.trim()||'لاعب';send('create',{name:me})}
function joinRoom(){me=$('name').value.trim()||'لاعب';room=$('room').value.trim().toUpperCase();if(!room)return toast('اكتب رمز الغرفة');send('join',{name:me,room})}
function showLobby(m){$('roomCode').textContent=m.room;$('codeTop').textContent=m.room;$('login').classList.add('hidden');$('lobby').classList.remove('hidden');$('startBtn').style.display=m.host?'block':'none';$('players').innerHTML=m.players.map((p,i)=>`<div class="pill" style="display:block;margin:7px 0">🎮 ${p.name}${i===0?' — المضيف':''}</div>`).join('')}
function startOnline(){send('start',{room})}
function leave(){location.reload()}
function showGame(){$('login').classList.add('hidden');$('lobby').classList.add('hidden');$('game').classList.remove('hidden')}
function lab(v){return ({skip:'⊘',reverse:'↔',draw2:'+2',draw4:'+4',wild:'★'})[v]||v}
function card(c,click){let cl=c.color==='wild'?'wild':c.color;return `<div class="card ${cl} ${click?'mycard':''}" ${click?`onclick="play(${c.id})`:''}><span class="oval"></span><span class="v">${lab(c.value)}</span></div>`}
function play(id){send('play',{room,id})}
function draw(){send('draw',{room})}
function uno(){send('uno',{room})}
function chooseColor(c){$('colorModal').classList.add('hidden');send('color',{room,color:c})}
function render(s){
 state=s;$('codeTop').textContent=s.room;
 let mep=s.players.find(p=>p.id===s.me);$('me').textContent=mep?mep.name:me;
 $('discard').innerHTML=card(s.discard,false);$('hand').innerHTML=mep?mep.hand.map(c=>card(c,true)).join(''):'';
 $('turn').textContent=s.players[s.turn].id===s.me?'دورك الآن':'دور '+s.players[s.turn].name;
 $('status').textContent='اللون الحالي: '+(s.color||s.discard.color);
 let slots=['p0','p1','p2','p3'];$('playersBoard').innerHTML=s.players.map((p,i)=>`<div class="player ${slots[i]} ${i===s.turn?'active':''}"><div class="avatar">🎮</div><div class="name">${p.name}</div><div class="count">${p.hand.length} أوراق</div></div>`).join('');
 if(s.awaitColor && s.players[s.turn].id===s.me)$('colorModal').classList.remove('hidden');else $('colorModal').classList.add('hidden');
}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2200)}
$('createBtn').disabled=true;$('joinBtn').disabled=true;connect();
</script></body></html>
