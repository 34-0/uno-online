<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO Games</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 font-family:Tahoma,Arial,sans-serif;
 color:#fff;
 background:
 radial-gradient(circle at top,#27106d,#08051b 45%,#02030a);
}

button,input{font:inherit}

.hidden{display:none!important}

.screen{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.panel{
 width:min(650px,95vw);
 background:#070817f5;
 border:2px solid #7d35ff;
 border-radius:25px;
 padding:25px;
 box-shadow:0 0 40px #7d35ff55;
}

.logo{
 text-align:center;
 font-size:75px;
 font-weight:1000;
 font-style:italic;
 text-shadow:
 4px 4px #ef1730,
 -3px -3px #ffd400,
 0 0 30px #ff28c8;
}

.sub{
 text-align:center;
 color:#cfc9ff;
}

.field{
 width:100%;
 padding:14px;
 margin:7px 0;
 border-radius:13px;
 border:1px solid #575d91;
 background:#090b20;
 color:#fff;
 outline:none;
}

.row{
 display:flex;
 gap:10px;
}

.btn{
 border:0;
 border-radius:13px;
 padding:13px 18px;
 font-weight:900;
 cursor:pointer;
 color:#fff;
 margin:4px;
}

.btn:disabled{
 opacity:.45;
 cursor:not-allowed;
}

.primary{
 background:linear-gradient(135deg,#164eff,#a019ff,#ff16c8);
}

.secondary{
 background:#171a3c;
 border:1px solid #575d91;
}

.green{
 background:linear-gradient(135deg,#00a56a,#00e69d);
 color:#03130d;
}

.games{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin:18px 0;
}

.gameBtn{
 padding:20px 10px;
 border:2px solid #3e4380;
 border-radius:18px;
 background:#0d1029;
 color:#fff;
 cursor:pointer;
 font-weight:1000;
 font-size:19px;
 transition:.15s;
}

.gameBtn:hover{
 transform:translateY(-3px);
 border-color:#ff28c8;
 box-shadow:0 0 20px #ff28c833;
}

.gameBtn.selected{
 border-color:#ff28c8;
 background:linear-gradient(135deg,#181d53,#53105c);
 box-shadow:0 0 25px #ff28c844;
}

.note{
 text-align:center;
 color:#aaa8d5;
 font-size:13px;
}

.lobbyTitle{
 text-align:center;
}

.roomCode{
 text-align:center;
 font-size:48px;
 font-weight:1000;
 color:#ffd43b;
 letter-spacing:8px;
}

.player{
 background:#10132d;
 border:1px solid #4c5085;
 border-radius:12px;
 padding:10px;
 margin:7px 0;
}

#game{
 min-height:100vh;
 padding:15px;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
 gap:10px;
 background:#070817ee;
 border:1px solid #6633c8;
 border-radius:16px;
 padding:10px;
}

.brand{
 font-size:28px;
 font-weight:1000;
}

.pill{
 display:inline-block;
 background:#10132d;
 border:1px solid #50558b;
 border-radius:20px;
 padding:8px 12px;
 margin:3px;
}

.arena{
 min-height:620px;
 margin:15px auto;
 max-width:1100px;
 background:#061c19;
 border:7px solid #55259a;
 border-radius:35px;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 overflow:hidden;
}

.center{
 display:flex;
 gap:20px;
 align-items:center;
}

.deck,.card{
 width:85px;
 height:120px;
 border-radius:14px;
 border:3px solid white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:30px;
 font-weight:1000;
}

.deck{
 background:repeating-linear-gradient(
 45deg,#11164b 0 8px,#48208b 8px 16px
 );
 cursor:pointer;
}

.red{background:#ed2538}
.yellow{background:#f3ca00;color:#111}
.greenC{background:#10a968}
.blue{background:#2479e7}

.wild{
 background:linear-gradient(
 135deg,
 #ed2538 0 25%,
 #f3ca00 25% 50%,
 #10a968 50% 75%,
 #2479e7 75%
 );
}

.handbox{
 max-width:1100px;
 margin:auto;
 background:#070817ee;
 border:1px solid #6633c8;
 border-radius:17px;
 padding:12px;
}

.hand{
 display:flex;
 justify-content:center;
 overflow:auto;
 direction:ltr;
 min-height:125px;
}

.mycard{
 margin:0 -7px;
 cursor:pointer;
 transition:.15s;
}

.mycard:hover{
 transform:translateY(-14px);
}

#playersBoard{
 position:absolute;
 inset:0;
}

.boardPlayer{
 position:absolute;
 background:#070817ee;
 border:1px solid #656ba5;
 border-radius:13px;
 padding:8px 12px;
}

.xoGrid{
 display:grid;
 grid-template-columns:repeat(3,100px);
 gap:8px;
}

.xoCell{
 width:100px;
 height:100px;
 background:#101535;
 border:2px solid #6b42d8;
 border-radius:15px;
 color:#fff;
 font-size:50px;
 font-weight:1000;
 cursor:pointer;
}

.xoCell:hover{
 background:#1b2050;
}

.gameTitle{
 position:absolute;
 top:20px;
 font-size:30px;
 font-weight:1000;
}

.bowling{
 width:min(600px,90vw);
 text-align:center;
}

.lane{
 height:330px;
 background:
 repeating-linear-gradient(
  90deg,
  #b5783e 0 35px,
  #c88a4c 35px 70px
 );
 border-radius:20px;
 padding-top:25px;
}

.pins{
 font-size:70px;
 letter-spacing:10px;
}

.ball{
 font-size:70px;
 margin-top:120px;
 cursor:pointer;
 transition:.2s;
}

.power{
 width:80%;
 accent-color:#ff28c8;
}

.pool{
 width:min(800px,90vw);
 height:420px;
 background:#063e32;
 border:25px solid #6b3b20;
 border-radius:35px;
 position:relative;
 box-shadow:inset 0 0 40px #000;
}

.poolBall{
 width:30px;
 height:30px;
 border-radius:50%;
 position:absolute;
 border:2px solid #fff;
 cursor:pointer;
}

.white{background:#fff}
.redBall{background:#e52b35}
.yellowBall{background:#f2cc00}
.blueBall{background:#287be0}
.greenBall{background:#15aa6b}
.purpleBall{background:#9a35d7}

.chat{
 position:fixed;
 left:18px;
 bottom:18px;
 width:min(350px,calc(100vw - 36px));
 background:#070817f8;
 border:2px solid #7d35ff;
 border-radius:17px;
 padding:10px;
}

.chatMsgs{
 height:180px;
 overflow:auto;
 background:#090b20;
 border-radius:10px;
 padding:8px;
}

.msg{
 margin:5px;
 padding:6px;
 border-radius:8px;
 background:#171a3d;
}

@media(max-width:600px){
 .games{grid-template-columns:1fr}
 .row{flex-direction:column}
 .xoGrid{grid-template-columns:repeat(3,75px)}
 .xoCell{width:75px;height:75px}
 .arena{min-height:500px}
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="screen">

<div class="panel">

<div class="logo">UNO</div>

<p class="sub">
اختر اللعبة ثم أنشئ غرفة أو انضم إلى أصدقائك
</p>

<input
 id="name"
 class="field"
 maxlength="18"
 placeholder="اسمك"
 value="راشد"
>

<h3>🎮 اختر اللعبة</h3>

<div class="games">

<button class="gameBtn selected" data-game="uno">
🃏<br>UNO
</button>

<button class="gameBtn" data-game="xo">
❌⭕<br>XO
</button>

<button class="gameBtn" data-game="bowling">
🎳<br>بولنق
</button>

<button class="gameBtn" data-game="billiards">
🎱<br>بلياردو
</button>

</div>

<input
 id="room"
 class="field"
 maxlength="8"
 placeholder="رمز الغرفة"
>

<div class="row">

<button
 id="createBtn"
 class="btn primary"
 style="flex:1"
 disabled
>
إنشاء غرفة
</button>

<button
 id="joinBtn"
 class="btn secondary"
 style="flex:1"
 disabled
>
انضمام
</button>

</div>

<button
 id="botBtn"
 class="btn green"
 style="width:100%"
>
🤖 لعب UNO ضد البوتات
</button>

<p id="conn" class="note">
الاتصال: جاري الاتصال...
</p>

<p class="note">
المطور:
<a
 href="https://www.instagram.com/DPYT/"
 target="_blank"
 style="color:#ff29c8;font-weight:1000"
>
DPYT
</a>
</p>

</div>
</div>

<!-- LOBBY -->

<div id="lobby" class="screen hidden">

<div class="panel">

<div class="logo" style="font-size:55px">
UNO
</div>

<h2 class="lobbyTitle">
غرفة اللعب
</h2>

<div id="gameName" class="note"></div>

<div id="roomCode" class="roomCode"></div>

<p class="sub">
أرسل رمز الغرفة لأصدقائك
</p>

<div id="players"></div>

<button
 id="startBtn"
 class="btn primary"
 style="width:100%"
>
ابدأ اللعبة
</button>

<button
 class="btn secondary"
 style="width:100%"
 onclick="location.reload()"
>
خروج
</button>

</div>
</div>

<!-- GAME -->

<div id="game" class="hidden">

<div class="top">

<div class="brand">
🎮 <span id="gameTitle">اللعبة</span>
</div>

<div>
<span class="pill">
👤 <b id="me"></b>
</span>

<span class="pill">
الغرفة:
<b id="codeTop"></b>
</span>

<button
 class="btn secondary"
 onclick="location.reload()"
>
خروج
</button>
</div>

</div>

<div id="arena" class="arena"></div>

<div id="handbox" class="handbox hidden">

<div id="hand" class="hand"></div>

<div style="text-align:center">

<button
 class="btn secondary"
 onclick="drawCard()"
>
سحب ورقة
</button>

<button
 class="btn green"
 onclick="sayUno()"
>
UNO!
</button>

</div>

<div id="status" class="note"></div>

</div>

</div>

<!-- CHAT -->

<div id="chat" class="chat hidden">

<b>💬 دردشة الغرفة</b>

<div id="chatMsgs" class="chatMsgs"></div>

<div style="display:flex;gap:5px;margin-top:7px">

<input
 id="chatInput"
 class="field"
 style="margin:0"
 placeholder="اكتب رسالة..."
>

<button
 id="chatSend"
 class="btn primary"
>
إرسال
</button>

</div>

</div>

<script>

let ws=null;
let online=false;
let selectedGame="uno";
let me="";
let room="";

const $ = id =>
 document.getElementById(id);

const gameNames={
 uno:"🃏 UNO",
 xo:"❌⭕ XO",
 bowling:"🎳 بولنق",
 billiards:"🎱 بلياردو"
};

document.querySelectorAll(".gameBtn")
.forEach(btn=>{

 btn.onclick=()=>{

  document
  .querySelectorAll(".gameBtn")
  .forEach(b=>b.classList.remove("selected"));

  btn.classList.add("selected");

  selectedGame=btn.dataset.game;

  $("botBtn").style.display =
   selectedGame==="uno"
   ? "block"
   : "none";
 };
});

function send(type,data={}){

 if(!ws || ws.readyState!==WebSocket.OPEN){

  alert("الاتصال بالسيرفر غير جاهز");

  return;
 }

 ws.send(JSON.stringify({
  type,
  ...data
 }));
}

function connect(){

 const protocol =
  location.protocol==="https:"
  ? "wss:"
  : "ws:";

 ws=new WebSocket(
  protocol+"//"+location.host
 );

 ws.onopen=()=>{

  online=true;

  $("conn").textContent=
   "الاتصال: متصل ✓";

  $("createBtn").disabled=false;
  $("joinBtn").disabled=false;
 };

 ws.onclose=()=>{

  online=false;

  $("conn").textContent=
   "الاتصال: انقطع ✕";
 };

 ws.onerror=()=>{

  $("conn").textContent=
   "خطأ في الاتصال";
 };

 ws.onmessage=e=>{

  let m;

  try{
   m=JSON.parse(e.data);
  }catch{
   return;
  }

  if(m.type==="connected"){
   return;
  }

  if(m.type==="error"){
   alert(m.message);
   return;
  }

  if(m.type==="room"){
   showLobby(m);
   return;
  }

  if(m.type==="started"){

   showGame();

   if(m.state.game==="uno"){
    renderUNO(m.state);
   }

   return;
  }

  if(m.type==="state"){

   showGame();
   renderUNO(m.state);

   return;
  }

  if(m.type==="gameState"){

   showGame();
   renderOtherGame(m.state);

   return;
  }

  if(m.type==="chat"){

   addChat(m);

  }

 };

}

$("createBtn").onclick=()=>{

 me=
  $("name").value.trim()
  ||"لاعب";

 send(
  "create",
  {
   name:me,
   game:selectedGame
  }
 );

};

$("joinBtn").onclick=()=>{

 me=
  $("name").value.trim()
  ||"لاعب";

 room=
  $("room").value
  .trim()
  .toUpperCase();

 if(!room){

  alert("اكتب رمز الغرفة");

  return;
 }

 send(
  "join",
  {
   name:me,
   room,
   game:selectedGame
  }
 );

};

$("startBtn").onclick=()=>{

 send(
  "start",
  {room}
 );

};

function showLobby(m){

 room=m.room;

 $("login").classList.add("hidden");
 $("game").classList.add("hidden");
 $("lobby").classList.remove("hidden");

 $("roomCode").textContent=
  room;

 $("gameName").textContent=
  gameNames[m.game] || m.game;

 const isHost=
  m.host === m.players[0]?.id;

 $("startBtn").style.display=
  isHost
  ? "block"
  : "none";

 $("players").innerHTML=
  m.players.map(
   (p,i)=>`
    <div class="player">
     ${i===0?"👑":"🎮"}
     <b>${escapeHtml(p.name)}</b>
     ${i===0?" — المضيف":""}
    </div>
   `
  ).join("");

}

function showGame(){

 $("login").classList.add("hidden");
 $("lobby").classList.add("hidden");
 $("game").classList.remove("hidden");

 $("codeTop").textContent=
  room;

 $("me").textContent=
  me;

 $("gameTitle").textContent=
  gameNames[selectedGame];

 $("chat").classList.remove("hidden");

}

function escapeHtml(s){

 return String(s).replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c])
 );

}

/* UNO */

function card(c,click=false){

 let cls=
  c.color==="wild"
  ?"wild"
  :c.color==="green"
  ?"greenC"
  :c.color;

 const value={
  skip:"⊘",
  reverse:"↔",
  draw2:"+2",
  draw4:"+4",
  wild:"★"
 }[c.value] || c.value;

 return `
  <div
   class="card ${cls} ${click?"mycard":""}"
   ${click?
    `onclick="playCard(${c.id})"`
    :""}
  >
   ${value}
  </div>
 `;
}

function renderUNO(s){

 $("handbox").classList.remove("hidden");

 $("gameTitle").textContent="🃏 UNO";

 $("hand").innerHTML=
  s.players.find(p=>p.id===s.me)
  ?.hand
  .map(c=>card(c,true))
  .join("")
  ||"";

 $("arena").innerHTML=`

  <div class="center">

   <div
    class="deck"
    onclick="drawCard()"
   >
    UNO
   </div>

   ${card(s.discard)}

  </div>

 `;

 $("status").textContent=
  s.players[s.turn].id===s.me
  ?"🔥 دورك الآن"
  :"دور "+s.players[s.turn].name+
   " | اللون: "+
   (s.color||s.discard.color);

}

function playCard(id){

 send(
  "play",
  {
   room,
   id
  }
 );

}

function drawCard(){

 send(
  "draw",
  {room}
 );

}

function sayUno(){

 send(
  "uno",
  {room}
 );

}

/* XO */

function renderXO(s){

 $("handbox").classList.add("hidden");

 $("gameTitle").textContent="❌⭕ XO";

 let text="";

 if(s.winner){
  text=
   "🏆 الفائز: "+
   (s.winner==="X"
    ?s.players[0].name
    :s.players[1].name);
 }else if(s.draw){
  text="🤝 تعادل";
 }else{
  text=
   "دور: "+
   s.players[s.turn].name;
 }

 $("arena").innerHTML=`

  <div>

   <div class="gameTitle">
    ${text}
   </div>

   <div class="xoGrid">

    ${s.board.map(
     (v,i)=>`
      <button
       class="xoCell"
       onclick="xoMove(${i})"
      >
       ${v}
      </button>
     `
    ).join("")}

   </div>

   <div style="text-align:center;margin-top:15px">

    <button
     class="btn primary"
     onclick="xoRestart()"
    >
     🔄 إعادة
    </button>

   </div>

  </div>
 `;

}

function xoMove(index){

 send(
  "xoMove",
  {
   room,
   index
  }
 );

}

function xoRestart(){

 send(
  "xoRestart",
  {room}
 );

}

/* BOWLING */

function renderBowling(s){

 $("handbox").classList.add("hidden");

 const score=
  s.scores
  .map(
   (v,i)=>
    `${s.players[i].name}: ${v}`
  )
  .join(" | ");

 $("arena").innerHTML=`

  <div class="bowling">

   <div class="gameTitle">
    🎳 البولنق — الجولة ${s.frame}
   </div>

   <h3>${score}</h3>

   <div class="lane">

    <div class="pins">
     🎳
    </div>

    <div
     class="ball"
     onclick="bowl()"
    >
     ⚫
    </div>

   </div>

   <p>
    دور: ${s.players[s.turn].name}
   </p>

   <input
    id="power"
    class="power"
    type="range"
    min="1"
    max="10"
    value="7"
   >

   <br>

   <button
    class="btn primary"
    onclick="bowl()"
   >
    🎳 ارمي الكرة
   </button>

   <button
    class="btn secondary"
    onclick="bowlingRestart()"
   >
    🔄 إعادة
   </button>

  </div>
 `;

}

function bowl(){

 const power=
  Number(
   $("power")?.value || 7
  );

 send(
  "bowl",
  {
   room,
   power
  }
 );

}

function bowlingRestart(){

 send(
  "bowlingRestart",
  {room}
 );

}

/* BILLIARDS */

function renderBilliards(s){

 $("handbox").classList.add("hidden");

 $("arena").innerHTML=`

  <div>

   <div class="gameTitle">
    🎱 البلياردو
   </div>

   <div class="pool">

    ${s.balls.map(
     b=>`
      <div
       class="poolBall
       ${b.color==="white"
        ?"white"
        :b.color+"Ball"}"
       style="
        left:${b.x}%;
        top:${b.y}%;
        transform:translate(-50%,-50%)
       "
      ></div>
     `
    ).join("")}

   </div>

   <p style="text-align:center">
    دور: ${s.players[s.turn].name}
   </p>

   <div style="text-align:center">

    <button
     class="btn primary"
     onclick="shootPool()"
    >
     🎱 اضرب
    </button>

    <button
     class="btn secondary"
     onclick="billiardsRestart()"
    >
     🔄 إعادة
    </button>

   </div>

  </div>
 `;

}

function shootPool(){

 const x=
  20+
  Math.random()*60;

 const y=
  20+
  Math.random()*60;

 send(
  "shoot",
  {
   room,
   x,
   y
  }
 );

}

function billiardsRestart(){

 send(
  "billiardsRestart",
  {room}
 );

}

function renderOtherGame(s){

 if(s.game==="xo"){
  renderXO(s);
 }

 if(s.game==="bowling"){
  renderBowling(s);
 }

 if(s.game==="billiards"){
  renderBilliards(s);
 }

}

/* BOT UNO */

$("botBtn").onclick=()=>{

 $("login").classList.add("hidden");
 $("game").classList.remove("hidden");

 $("chat").classList.add("hidden");

 $("gameTitle").textContent=
  "🤖 UNO ضد البوتات";

 $("arena").innerHTML=`

  <div style="text-align:center">

   <div style="font-size:70px">
    🤖 🤖 🤖
   </div>

   <h2>
    وضع البوتات
   </h2>

   <p>
    يمكنك الرجوع إلى الأونلاين من زر الخروج.
   </p>

  </div>
 `;

 $("handbox").classList.add("hidden");

};

/* CHAT */

$("chatSend").onclick=sendChat;

$("chatInput").onkeydown=e=>{

 if(e.key==="Enter"){
  sendChat();
 }

};

function sendChat(){

 const input=
  $("chatInput");

 const text=
  input.value.trim();

 if(!text) return;

 send(
  "chat",
  {
   room,
   text
  }
 );

 input.value="";

}

function addChat(m){

 const box=
  $("chatMsgs");

 const div=
  document.createElement("div");

 div.className="msg";

 div.innerHTML=
  "<b>"+
  escapeHtml(m.name)+
  "</b>: "+
  escapeHtml(m.text);

 box.appendChild(div);

 box.scrollTop=
  box.scrollHeight;

}

connect();

</script>
