<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO Arcade</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(circle at 50% 10%,#24116b,#070517 45%,#02030b);overflow-x:hidden}button,input{font:inherit}.hidden{display:none!important}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.panel,.arcadeBox{width:min(780px,95vw);background:#050611ee;border:2px solid #7c35ff;border-radius:28px;padding:28px;box-shadow:0 0 35px #7b25ff55,0 0 100px #ff20e622}.logo{text-align:center;font-size:78px;font-weight:1000;font-style:italic;letter-spacing:-5px;text-shadow:5px 5px 0 #ed162c,-3px -3px 0 #ffd400,0 0 30px #ff3155}.sub{text-align:center;color:#d6d2ff}.field{width:100%;padding:14px;border-radius:14px;border:1px solid #5e6395;background:#090b20;color:#fff;margin:7px 0;outline:none}.row{display:flex;gap:10px}.btn{border:1px solid #fff2;border-radius:14px;padding:13px 17px;font-weight:900;cursor:pointer;color:#fff;box-shadow:0 6px 0 #0007;transition:.15s}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.primary{background:linear-gradient(135deg,#0b49ff,#8a18ff,#ff17c8)}.secondary{background:linear-gradient(135deg,#171a42,#38206b)}.green{background:linear-gradient(135deg,#00a968,#00e19a);color:#04130d}.gameGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.gameBtn{min-height:125px;border:1px solid #fff2;border-radius:20px;color:#fff;text-align:right;padding:18px;cursor:pointer}.gameBtn b{display:block;font-size:25px}.gameBtn small{display:block;margin-top:8px;color:#ddd}.unoG{background:linear-gradient(135deg,#1529ad,#4311a1)}.xoG{background:linear-gradient(135deg,#9c145e,#e7184d)}.bowlG{background:linear-gradient(135deg,#075d80,#08a86f)}.poolG{background:linear-gradient(135deg,#123f37,#075f83)}.sel{outline:3px solid #fff;box-shadow:0 0 30px #ff20c888}.note{text-align:center;color:#b8b4de;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#050611e8;border:1px solid #6d36d9;border-radius:18px;padding:10px 14px}.brand{font-size:29px;font-weight:1000;font-style:italic;text-shadow:2px 2px #ff204c,0 0 18px #ffd21f}.pill{background:#0d0f2b;border:1px solid #5e5ba0;border-radius:99px;padding:8px 12px;font-size:13px}#game{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px;max-width:1550px;margin:auto}.table{position:relative;min-height:590px;background:radial-gradient(ellipse at center,#123f37,#071d20 48%,#030713);border:7px solid #55259a;border-radius:38%/24%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 35px #7a28ff44,inset 0 0 60px #000}.center{display:flex;gap:22px;z-index:2}.deck,.card{width:86px;height:122px;border-radius:14px;border:3px solid #fff;box-shadow:0 9px 24px #000b,0 0 15px #fff2}.deck{background:repeating-linear-gradient(45deg,#10164e 0 7px,#43208b 7px 14px);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:1000;cursor:pointer}.card{position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-size:35px;font-weight:1000}.red{background:#ed2538}.yellow{background:#f3c900;color:#111}.greenC{background:#11a968}.blue{background:#2479e7}.wild{background:linear-gradient(135deg,#ed2538 0 25%,#f3c900 25% 50%,#11a968 50% 75%,#2479e7 75%)}.oval{position:absolute;width:65%;height:72%;border:3px solid #fff9;border-radius:50%;transform:rotate(-30deg)}.v{z-index:2}.player{position:absolute;background:#070914e8;border:1px solid #6b65a7;border-radius:16px;padding:8px 13px;text-align:center;min-width:130px}.p0{bottom:12px;left:50%;transform:translateX(-50%)}.p1{top:13px;left:50%;transform:translateX(-50%)}.p2{left:12px;top:50%;transform:translateY(-50%)}.p3{right:12px;top:50%;transform:translateY(-50%)}.active{border-color:#ffdb35;box-shadow:0 0 28px #ffdb3566}.handbox{background:#050611ee;border:1px solid #6534bd;border-radius:18px;padding:10px}.hand{display:flex;justify-content:center;align-items:flex-end;min-height:125px;overflow-x:auto;direction:ltr}.mycard{margin:0 -7px;cursor:pointer;transition:.16s}.mycard:hover{transform:translateY(-15px) scale(1.03);z-index:4}.turn{position:absolute;bottom:55px;background:#050611dd;border:1px solid #ff25d5;border-radius:99px;padding:8px 14px}.actions{text-align:center;margin-top:7px}.chatFab{position:fixed;right:20px;bottom:20px;width:62px;height:62px;border:2px solid #ff2ac8;border-radius:50%;background:linear-gradient(135deg,#152dff,#ff18c8);color:#fff;font-size:26px;cursor:pointer;z-index:100;box-shadow:0 0 25px #ff20c866}.chatPanel{position:fixed;right:20px;bottom:92px;width:min(370px,calc(100vw - 40px));height:460px;background:#050611f7;border:2px solid #7d2dff;border-radius:20px;z-index:99;display:flex;flex-direction:column;box-shadow:0 0 35px #7b22ff66;overflow:hidden}.chatHead{padding:12px 14px;background:linear-gradient(90deg,#101a52,#46105d);display:flex;justify-content:space-between;font-weight:1000}.chatClose{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}.chatMsgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.chatMsg{max-width:85%;background:#10132e;border:1px solid #3f4480;border-radius:13px;padding:8px 10px}.chatMsg.mine{align-self:flex-end;border-color:#ff2ac8;background:#28103a}.chatName{font-size:11px;color:#ff58d8;margin-bottom:3px}.chatComposer{padding:9px;border-top:1px solid #383a67}.emojiRow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}.emojiBtn{background:#0d1030;border:1px solid #4a4e85;border-radius:8px;padding:4px 7px;cursor:pointer;font-size:16px}.chatForm{display:flex;gap:6px}.chatInput{flex:1;background:#090b20;border:1px solid #555b92;color:#fff;border-radius:10px;padding:10px}.chatSend{background:linear-gradient(135deg,#264eff,#d51cff);border:0;color:#fff;border-radius:10px;padding:0 13px;font-weight:900;cursor:pointer}.arcade{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.boardXO{display:grid;grid-template-columns:repeat(3,120px);gap:10px;justify-content:center;margin:25px auto}.xoCell{width:120px;height:120px;border:2px solid #8c45ff;background:#0b0e2a;border-radius:18px;color:#fff;font-size:55px;cursor:pointer}.scoreRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.scoreCard{background:#0c102c;border:1px solid #555b92;border-radius:14px;padding:10px 14px}.pins{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;min-height:170px;align-items:center}.pin{font-size:48px}.lane{height:160px;border-radius:22px;background:linear-gradient(#b98645,#f1d09a);border:5px solid #8c5c2d;display:flex;align-items:flex-end;justify-content:center}.ball{font-size:70px}.power{width:min(500px,90%)}.pool{position:relative;height:430px;max-width:850px;margin:20px auto;border:18px solid #6b3d1f;border-radius:30px;background:#08735f;box-shadow:inset 0 0 50px #003b33}.poolBall{position:absolute;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;border:2px solid #fff;color:#fff;cursor:pointer}.cue{background:#eee;color:#111}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#050611f5;border:1px solid #ff25d5;padding:11px 18px;border-radius:99px;z-index:150;opacity:0;pointer-events:none}.toast.show{opacity:1}@media(max-width:650px){.gameGrid{grid-template-columns:1fr}.logo{font-size:62px}.table{min-height:500px}.card,.deck{width:70px;height:100px}.top{flex-direction:column}.boardXO{grid-template-columns:repeat(3,90px)}.xoCell{width:90px;height:90px}.pool{height:330px}}

/* REALISTIC BOWLING + BILLIARDS UPGRADE */
.bowlReal{max-width:980px;margin:10px auto}.bowlScore{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}.bowlCard{background:linear-gradient(180deg,#151a30,#090d1d);border:1px solid #596184;border-radius:12px;padding:8px 14px;min-width:110px;text-align:center}.bowlScene{position:relative;height:500px;border-radius:24px;overflow:hidden;background:linear-gradient(90deg,#161b2d 0 9%,#b98245 9% 91%,#161b2d 91%);box-shadow:inset 0 0 45px #0009,0 12px 35px #0008;border:5px solid #5b371e}.bowlLane{position:absolute;left:9%;right:9%;top:0;bottom:0;background:linear-gradient(90deg,#a96f38,#e6c38e 9%,#f6e0ad 50%,#e6c38e 91%,#a96f38);background-size:80px 100%;}.bowlArrows{position:absolute;top:60%;left:20%;right:20%;display:flex;justify-content:space-around;color:#855d37;font-size:25px}.bowlFoul{position:absolute;left:9%;right:9%;bottom:16%;height:4px;background:#b21f35}.bowlPinsReal{position:absolute;top:9%;left:50%;width:180px;height:170px;transform:translateX(-50%)}.pinReal{position:absolute;width:30px;height:58px;border-radius:45% 45% 40% 40%;background:linear-gradient(90deg,#c8c8c8,#fff 30%,#fff 70%,#bdbdbd);box-shadow:0 5px 9px #0007}.pinReal:before{content:'';position:absolute;left:3px;right:3px;top:13px;height:8px;background:#e72b38;box-shadow:0 10px 0 #e72b38;border-radius:4px}.bowlBallReal{position:absolute;bottom:8%;left:50%;width:64px;height:64px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 28% 25%,#777,#171717 45%,#030303 78%);box-shadow:inset -8px -10px 12px #000b,0 9px 15px #0009;transition:left .55s cubic-bezier(.2,.8,.2,1),bottom .55s}.bowlBallReal:after{content:'•••';position:absolute;left:18px;top:16px;color:#111;letter-spacing:2px;font-size:15px}.bowlControls{margin-top:14px;text-align:center}.bowlPower{width:min(520px,90%);accent-color:#ff2ac8}.bowlAim{width:min(520px,90%);accent-color:#2c78ff}.bowlHint{color:#b9bdd9;font-size:12px;margin-top:7px}
.poolReal{max-width:1050px;margin:10px auto}.poolWrap{position:relative;width:min(100%,980px);aspect-ratio:2/1;margin:12px auto;padding:34px;background:#4a2a16;border-radius:30px;box-shadow:0 22px 50px #000b,inset 0 0 20px #0009}.poolTableReal{position:relative;width:100%;height:100%;border-radius:14px;background:radial-gradient(ellipse at center,#12876d,#075c4b 70%,#043d34);box-shadow:inset 0 0 45px #001f19,0 0 0 7px #7a4b25}.pocketReal{position:absolute;width:34px;height:34px;background:#030303;border-radius:50%;box-shadow:inset 0 0 12px #000,0 2px 4px #000;z-index:5}.pocketReal.tl{left:-17px;top:-17px}.pocketReal.tr{right:-17px;top:-17px}.pocketReal.bl{left:-17px;bottom:-17px}.pocketReal.br{right:-17px;bottom:-17px}.pocketReal.tm{left:50%;top:-17px;transform:translateX(-50%)}.pocketReal.bm{left:50%;bottom:-17px;transform:translateX(-50%)}.poolBallReal{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #ffffff88;box-shadow:inset -5px -6px 7px #0007,3px 5px 8px #0008;z-index:4;transition:left .65s ease,top .65s ease}.poolBallReal.solid1{background:#f4d32c}.poolBallReal.solid2{background:#245fe0}.poolBallReal.solid3{background:#d82b3c}.poolBallReal.solid4{background:#742ab7}.poolBallReal.solid5{background:#ee7a22}.poolBallReal.solid6{background:#16864d}.poolBallReal.solid7{background:#8d211f}.poolBallReal.solid8{background:#101010}.poolBallReal.stripe{background:linear-gradient(#f6f6f6 0 28%,var(--ball,#e22) 28% 72%,#f6f6f6 72%)}.poolBallReal.cueReal{background:radial-gradient(circle at 28% 25%,#fff,#d9d9d9 60%,#999);z-index:6}.ballNum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:#fff;color:#111;font:700 8px Arial;display:flex;align-items:center;justify-content:center}.cueLine{position:absolute;height:3px;background:linear-gradient(90deg,#fff8,#fff0);transform-origin:left center;z-index:3;pointer-events:none}.poolAim{position:absolute;inset:0;z-index:10;cursor:crosshair}.poolControls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}.poolPower{width:260px;accent-color:#ff2ac8}.poolLegend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;color:#c9cbe1;font-size:12px;margin:8px}.cueStick{position:absolute;height:7px;border-radius:7px;background:linear-gradient(90deg,#9b6a36,#e9c79a 72%,#f7f7f7 73%,#f7f7f7 78%,#9b6a36);box-shadow:0 4px 8px #0009;transform-origin:0 50%;z-index:8;pointer-events:none}
@media(max-width:700px){.bowlScene{height:420px}.poolWrap{padding:25px}.poolBallReal{width:23px;height:23px}.pocketReal{width:28px;height:28px}.poolWrap{border-radius:22px}.cueStick{height:5px}}
</style></head><body>
<div id="menu" class="screen"><div class="panel"><div class="logo">UNO</div><p class="sub">UNO Arcade — أربع ألعاب في مكان واحد</p><input id="name" class="field" maxlength="18" placeholder="اسمك" value="راشد"><h3>اختر اللعبة</h3><div class="gameGrid"><button class="gameBtn unoG sel" data-game="uno" onclick="selectGame('uno')"><b>🃏 UNO</b><small>أونو أونلاين أو ضد 3 بوتات</small></button><button class="gameBtn xoG" data-game="xo" onclick="selectGame('xo')"><b>❌⭕ XO</b><small>لعب أونلاين أو ضد بوت</small></button><button class="gameBtn bowlG" data-game="bowling" onclick="selectGame('bowling')"><b>🎳 بولنق</b><small>جولات ضد لاعبين أو بوت</small></button><button class="gameBtn poolG" data-game="billiards" onclick="selectGame('billiards')"><b>🎱 بلياردو</b><small>تسديد الكرات ضد لاعب أو بوت</small></button></div><div class="row" style="margin-top:14px"><button class="btn primary" style="flex:1" onclick="createRoom()">🌐 إنشاء غرفة</button><button class="btn secondary" style="flex:1" onclick="joinRoom()">🔑 انضمام</button></div><input id="room" class="field" maxlength="8" placeholder="رمز الغرفة" style="text-transform:uppercase"><button class="btn green" style="width:100%;margin-top:8px" onclick="startBot()">🤖 اللعب مع بوت</button><p id="conn" class="note">الاتصال: جاري الاتصال...</p></div></div>
<div id="lobby" class="screen hidden"><div class="panel"><div class="logo" style="font-size:54px">UNO</div><h2 style="text-align:center">غرفة اللعب</h2><div id="roomCode" style="text-align:center;font-size:42px;font-weight:1000"></div><p id="lobbyGame" class="sub"></p><div id="players"></div><button class="btn primary" style="width:100%;margin-top:15px" onclick="startOnline()">ابدأ اللعبة</button><button class="btn secondary" style="width:100%;margin-top:10px" onclick="backMenu()">خروج</button></div></div>
<div id="game" class="hidden"><div class="top"><div class="brand">UNO ARCADE</div><div><span class="pill">👤 <b id="me"></b></span> <span class="pill">🎮 <b id="gameName"></b></span> <span class="pill">غرفة: <b id="codeTop"></b></span> <button class="btn secondary" onclick="backMenu()">خروج</button></div></div><main id="unoView" class="table"><div id="board"></div><div class="center"><div class="deck" onclick="drawCard()">UNO</div><div id="discard"></div></div><div id="turn" class="turn"></div></main><section class="handbox"><div id="hand" class="hand"></div><div class="actions"><button class="btn secondary" onclick="drawCard()">سحب ورقة</button> <button class="btn green" onclick="sayUno()">UNO!</button></div><div id="status" class="note"></div></section></div>
<div id="arcadeView" class="arcade hidden"><div class="arcadeBox"><h1 id="arcadeTitle" style="text-align:center"></h1><p id="arcadeStatus" class="note"></p><div id="arcadeContent"></div><button class="btn secondary" style="width:100%;margin-top:15px" onclick="backMenu()">خروج</button></div></div>
<div id="colorModal" class="screen hidden" style="position:fixed;inset:0;background:#000b;z-index:120"><div class="panel" style="max-width:430px;text-align:center"><h2>اختر اللون</h2><div class="row"><button class="btn" style="background:#e92b35;flex:1" onclick="pickColor('red')">أحمر</button><button class="btn" style="background:#f2c400;color:#111;flex:1" onclick="pickColor('yellow')">أصفر</button></div><div class="row" style="margin-top:10px"><button class="btn" style="background:#16a968;flex:1" onclick="pickColor('green')">أخضر</button><button class="btn" style="background:#287be0;flex:1" onclick="pickColor('blue')">أزرق</button></div></div></div>
<button id="chatFab" class="chatFab hidden" onclick="toggleChat()">💬</button><div id="chatPanel" class="chatPanel hidden"><div class="chatHead"><span>💬 دردشة الغرفة</span><button class="chatClose" onclick="toggleChat()">×</button></div><div id="chatMsgs" class="chatMsgs"></div><div class="chatComposer"><div class="emojiRow"><button class="emojiBtn" onclick="addEmoji('😀')">😀</button><button class="emojiBtn" onclick="addEmoji('😂')">😂</button><button class="emojiBtn" onclick="addEmoji('🔥')">🔥</button><button class="emojiBtn" onclick="addEmoji('❤️')">❤️</button><button class="emojiBtn" onclick="addEmoji('👍')">👍</button><button class="emojiBtn" onclick="addEmoji('🎉')">🎉</button><button class="emojiBtn" onclick="addEmoji('😎')">😎</button><button class="emojiBtn" onclick="addEmoji('👏')">👏</button></div><div class="chatForm"><input id="chatInput" class="chatInput" maxlength="180" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendChat()"><button class="chatSend" onclick="sendChat()">إرسال</button></div></div></div><div id="toast" class="toast"></div>
<script>
let ws=null,online=false,mode='menu',game='uno',me='',room='',state=null,bot=null;const $=id=>document.getElementById(id),G={uno:'UNO',xo:'XO',bowling:'بولنق',billiards:'بلياردو'},C=['red','yellow','green','blue'];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2200)}function selectGame(g){game=g;document.querySelectorAll('.gameBtn').forEach(x=>x.classList.toggle('sel',x.dataset.game===g))}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);ws.onopen=()=>{online=true;$('conn').textContent='الاتصال: متصل ✓'};ws.onclose=()=>{online=false;$('conn').textContent='الاتصال: انقطع'};ws.onerror=()=>$('conn').textContent='خطأ في الاتصال';ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='room')lobby(m);else if(m.type==='started'){showGame();render(m.state)}else if(m.type==='state')render(m.state);else if(m.type==='chat')addChat(m);else if(m.type==='error'||m.type==='toast'||m.type==='win')toast(m.message)}}
function send(t,o={}){if(!online)return toast('الاتصال غير جاهز');ws.send(JSON.stringify({type:t,...o}))}function createRoom(){me=$('name').value.trim()||'راشد';if(!online)return toast('انتظر اتصال السيرفر');send('create',{name:me,game})}function joinRoom(){me=$('name').value.trim()||'راشد';room=$('room').value.trim().toUpperCase();if(!room)return toast('اكتب رمز الغرفة');if(!online)return toast('انتظر اتصال السيرفر');send('join',{name:me,room,game})}
function lobby(m){room=m.room;$('roomCode').textContent=room;$('lobbyGame').textContent='اللعبة: '+G[m.game];$('players').innerHTML=m.players.map((p,i)=>`<div class="pill" style="display:block;margin:7px 0">🎮 ${esc(p.name)}${i?'':' — المضيف'}</div>`).join('');$('menu').classList.add('hidden');$('lobby').classList.remove('hidden')}
function showGame(){$('menu').classList.add('hidden');$('lobby').classList.add('hidden');$('chatFab').classList.toggle('hidden',mode==='bot');$('gameName').textContent=G[game];$('codeTop').textContent=room;if(game==='uno'){$('game').classList.remove('hidden');$('arcadeView').classList.add('hidden')}else{$('game').classList.add('hidden');$('arcadeView').classList.remove('hidden')}}function backMenu(){location.reload()}
function label(v){return({skip:'⊘',reverse:'↔',draw2:'+2',draw4:'+4',wild:'★'})[v]||v}function card(c,click){let cls=c.color==='wild'?'wild':c.color==='green'?'greenC':c.color;return `<div class="card ${cls} ${click?'mycard':''}" ${click?`onclick="playCard(${c.id})"`:''}><span class="oval"></span><span class="v">${label(c.value)}</span></div>`}
function render(s){state=s;game=s.game;room=s.room;if(game==='uno')renderUno(s);else if(game==='xo')renderXO(s);else if(game==='bowling')renderBowling(s);else renderPool(s)}function renderUno(s){let p=s.players.find(x=>x.id===s.me);$('me').textContent=p?.name||me;$('discard').innerHTML=card(s.discard);$('hand').innerHTML=(p?.hand||[]).map(c=>card(c,true)).join('');$('turn').textContent=s.players[s.turn]?.id===s.me?'دورك الآن':'دور '+s.players[s.turn]?.name;$('status').textContent='اللون الحالي: '+(s.color||s.discard.color);let pos=['p0','p1','p2','p3'];$('board').innerHTML=s.players.map((x,i)=>`<div class="player ${pos[i]} ${i===s.turn?'active':''}">🎮 <b>${esc(x.name)}</b><br><small>${x.hand.length} أوراق</small></div>`).join('');if(s.awaitColor&&s.players[s.turn]?.id===s.me)$('colorModal').classList.remove('hidden')}
function playCard(id){if(mode==='bot')return botUnoPlay(id);send('play',{room,id})}function drawCard(){if(mode==='bot')return botUnoDraw();send('draw',{room})}function sayUno(){if(mode==='bot'){if(bot.players[0].hand.length===1)toast('🔥 UNO!');return}send('uno',{room})}function pickColor(c){$('colorModal').classList.add('hidden');if(mode==='bot'){let p=bot.players[0],x=bot.pending;if(!x)return;let i=p.hand.indexOf(x);if(i>=0)p.hand.splice(i,1);bot.used.push(bot.discard);bot.discard=x;bot.color=c;if(x.value==='draw4'){bd(bot.players[(bot.turn+bot.dir+4)%4],4);bn()}else if(x.value==='reverse'){bot.dir*=-1}bn();bot.pending=null;if(!p.hand.length){bot.over=true;toast('🏆 '+p.name+' فاز!')}renderBotUno();if(!bot.over)runBU();return}send('color',{room,color:c})}
function renderXO(s){$('arcadeTitle').textContent='❌⭕ XO';$('arcadeStatus').textContent=s.winner?(s.winner==='draw'?'تعادل!':'الفائز: '+s.winner):'دور '+(s.players[s.turn]?.name||'');$('arcadeContent').innerHTML=`<div class="scoreRow">${s.players.map(p=>`<div class="scoreCard">${esc(p.name)}: <b>${p.symbol}</b></div>`).join('')}</div><div class="boardXO">${s.board.map((v,i)=>`<button class="xoCell" onclick="xoMove(${i})">${v||''}</button>`).join('')}</div>`}function xoMove(i){if(mode==='bot')return botXo(i);send('xo',{room,pos:i})}
function renderBowling(s){$('arcadeTitle').textContent='🎳 بولنق';$('arcadeStatus').textContent=`الجولة ${s.frame}/10 — ${s.roll?'الرمية الثانية':'الرمية الأولى'} — دور ${s.scores[s.turn]?.name||''}`;let pins=Array.from({length:s.pins},(_,i)=>{let row=Math.floor(i/3),col=i%3;let x=50+(col-1)*11+(row%2?5:0),y=16+row*10;return `<span class="pinReal" style="left:${x}px;top:${y}px;transform:translateX(-50%) scale(.92)"></span>`}).join('');$('arcadeContent').innerHTML=`<div class="bowlReal"><div class="bowlScore">${s.scores.map(x=>`<div class="bowlCard">${esc(x.name)}<br><b>${x.score}</b> نقطة</div>`).join('')}</div><div class="bowlScene"><div class="bowlLane"></div><div class="bowlArrows">◆ ◆ ◆ ◆ ◆</div><div class="bowlPinsReal">${pins}</div><div id="bowlBall" class="bowlBallReal"></div><div class="bowlFoul"></div></div><div class="bowlControls"><div>الزاوية</div><input id="bowlAim" class="bowlAim" type="range" min="20" max="80" value="50"><div>القوة</div><input id="power" class="bowlPower" type="range" min="10" max="100" value="72"><br><button class="btn primary" onclick="bowlShot()">🎳 رمي الكرة</button><div class="bowlHint">حرّك الزاوية ثم اختر القوة. الكرة تتحرك على المسار قبل احتساب الرمية.</div></div></div>`}
function bowlShot(){let power=Number($('power')?.value||72),aim=Number($('bowlAim')?.value||50);let ball=$('bowlBall');if(ball){ball.style.left=aim+'%';ball.style.bottom='78%';setTimeout(()=>{ball.style.bottom='90%';},180);setTimeout(()=>{ball.style.bottom='8%';},650)}if(mode==='bot')return botBowl(power,aim);send('bowl',{room,power:Math.max(.05,Math.min(1,power/100))})}

function renderPool(s){$('arcadeTitle').textContent='🎱 بلياردو';$('arcadeStatus').textContent=`دور ${s.score[s.turn]?.name||''}`;let positions=[[10,20],[50,50],[52,45],[52,55],[57,40],[57,50],[57,60],[62,35],[62,45],[62,55]];let h=`<div class="poolReal"><div class="scoreRow">${s.score.map(x=>`<div class="scoreCard">${esc(x.name)}: <b>${x.score}</b></div>`).join('')}</div><div class="poolLegend">🎱 كرات ملونة — ⚪ الكرة البيضاء — حرّك المؤشر لاختيار اتجاه العصا</div><div class="poolWrap"><div id="poolTable" class="poolTableReal"><div class="pocketReal tl"></div><div class="pocketReal tr"></div><div class="pocketReal tm"></div><div class="pocketReal bl"></div><div class="pocketReal br"></div><div class="pocketReal bm"></div>`;s.balls.forEach((b,i)=>{if(!b.on)return;let q=positions[i]||[50,50];h+=`<div class="poolBallReal solid${b.id}" style="left:${q[0]}%;top:${q[1]}%"><span class="ballNum">${b.id}</span></div>`});h+=`<div id="cueBall" class="poolBallReal cueReal" style="left:16%;top:50%"></div><div id="cueStick" class="cueStick" style="left:16%;top:50%;width:250px;transform:rotate(0deg) translateY(-50%)"></div><div id="poolAim" class="poolAim" onclick="poolAimClick(event)"></div></div></div><div class="poolControls"><label>القوة <input id="poolPower" class="poolPower" type="range" min="10" max="100" value="68"></label><button class="btn primary" onclick="poolShot()">🎱 سدّد</button></div></div>`;$('arcadeContent').innerHTML=h}
function poolAimClick(e){let t=$('poolTable');if(!t)return;let r=t.getBoundingClientRect(),x=e.clientX-r.left-r.width*.16,y=e.clientY-r.top-r.height*.5;let deg=Math.atan2(y,x)*180/Math.PI;let stick=$('cueStick');if(stick)stick.style.transform=`rotate(${deg}deg) translateY(-50%)`;window.poolAngle=deg}
function poolShot(){let power=Number($('poolPower')?.value||68);let angle=Number(window.poolAngle||0);let cue=$('cueBall');if(cue){let rad=angle*Math.PI/180;cue.style.left=(16+Math.cos(rad)*Math.min(35,power*.38))+'%';cue.style.top=(50+Math.sin(rad)*Math.min(35,power*.38))+'%';setTimeout(()=>{cue.style.left='16%';cue.style.top='50%'},700)}if(mode==='bot')return botPool(power,angle);send('billiards',{room,aim:Math.round((angle+180)/360*100)})}
function startOnline(){send('start',{room})}
function startBot(){mode='bot';me=$('name').value.trim()||'راشد';room='BOT';showGame();if(game==='uno')startBotUno();else if(game==='xo')startBotXO();else if(game==='bowling')startBotBowling();else startBotPool();toast('🤖 بدأت مباراة ضد البوت')}
function makeDeck(){let d=[],n=1,a=(c,v)=>d.push({id:n++,color:c,value:v});C.forEach(c=>{a(c,'0');for(let i=1;i<10;i++){a(c,''+i);a(c,''+i)}['skip','reverse','draw2'].forEach(v=>{a(c,v);a(c,v)})});for(let i=0;i<4;i++){a('wild','wild');a('wild','draw4')}return d}function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function startBotUno(){bot={players:[{name:me,hand:[]},{name:'بوت 1',hand:[]},{name:'بوت 2',hand:[]},{name:'بوت 3',hand:[]}],deck:makeDeck(),used:[],discard:null,color:null,turn:0,dir:1,over:false};sh(bot.deck);for(let i=0;i<7;i++)bot.players.forEach(p=>p.hand.push(bot.deck.pop()));do bot.discard=bot.deck.pop();while(bot.discard.color==='wild');bot.color=bot.discard.color;renderBotUno()}function bv(c){return c.color==='wild'||c.color===bot.color||c.color===bot.discard.color||c.value===bot.discard.value}function bd(p,n=1){for(let i=0;i<n;i++){if(!bot.deck.length&&bot.used.length){bot.deck=bot.used.splice(0);sh(bot.deck)}if(bot.deck.length)p.hand.push(bot.deck.pop())}}function bn(){bot.turn=(bot.turn+bot.dir+4)%4}function bp(p,c){let i=p.hand.indexOf(c);if(i<0||!bv(c))return false;p.hand.splice(i,1);bot.used.push(bot.discard);bot.discard=c;if(c.color!=='wild')bot.color=c.color;else bot.color=C[Math.floor(Math.random()*4)];if(c.value==='reverse')bot.dir*=-1;if(c.value==='skip')bn();if(c.value==='draw2'){bd(bot.players[(bot.turn+bot.dir+4)%4],2);bn()}if(c.value==='draw4'){bd(bot.players[(bot.turn+bot.dir+4)%4],4);bn()}bn();if(!p.hand.length){bot.over=true;toast('🏆 '+p.name+' فاز!')}return true}function renderBotUno(){let p=bot.players[0];$('me').textContent=p.name;$('codeTop').textContent='BOT';$('discard').innerHTML=card(bot.discard);$('hand').innerHTML=p.hand.map(c=>card(c,true)).join('');$('turn').textContent=bot.over?'انتهت المباراة':bot.turn===0?'دورك الآن':'دور '+bot.players[bot.turn].name;$('status').textContent='اللون الحالي: '+bot.color+' — ضد 3 بوتات';let pos=['p0','p1','p2','p3'];$('board').innerHTML=bot.players.map((p,i)=>`<div class="player ${pos[i]} ${i===bot.turn?'active':''}">🤖 <b>${esc(p.name)}</b><br><small>${p.hand.length} أوراق</small></div>`).join('')}function botUnoPlay(id){if(bot.over||bot.turn!==0)return;let p=bot.players[0],c=p.hand.find(x=>x.id===id);if(!c||!bv(c))return toast('هذه الورقة غير صالحة');if(c.color==='wild'){$('colorModal').classList.remove('hidden');bot.pending=c;return}bp(p,c);renderBotUno();if(!bot.over)runBU()}function botUnoDraw(){if(bot.over||bot.turn!==0)return;bd(bot.players[0]);bn();renderBotUno();runBU()}function runBU(){if(bot.over||bot.turn===0)return;setTimeout(()=>{let p=bot.players[bot.turn],v=p.hand.filter(bv);if(!v.length){bd(p);bn();renderBotUno();return runBU()}bp(p,v[Math.floor(Math.random()*v.length)]);renderBotUno();if(!bot.over)runBU()},650)}
function startBotXO(){bot={b:Array(9).fill(null),turn:0,over:false};renderBotXO()}function xwin(b){for(let q of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]){let[a,c,d]=q;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a]}return b.every(Boolean)?'draw':null}function renderBotXO(){$('arcadeTitle').textContent='❌⭕ XO';$('arcadeStatus').textContent=bot.over?'انتهت المباراة':bot.turn?'دور البوت (O)':'دورك (X)';$('arcadeContent').innerHTML=`<div class="boardXO">${bot.b.map((v,i)=>`<button class="xoCell" onclick="botXo(${i})">${v||''}</button>`).join('')}</div>`}function botXo(i){if(bot.over||bot.turn||bot.b[i])return;bot.b[i]='X';let w=xwin(bot.b);if(w){bot.over=true;toast(w==='draw'?'تعادل!':'🏆 فزت!');return renderBotXO()}bot.turn=1;renderBotXO();setTimeout(()=>{let e=bot.b.map((v,i)=>v?null:i).filter(i=>i!==null);bot.b[e[Math.floor(Math.random()*e.length)]]='O';w=xwin(bot.b);if(w){bot.over=true;toast(w==='draw'?'تعادل!':'🤖 البوت فاز!')}else bot.turn=0;renderBotXO()},600)}
function startBotBowling(){bot={frame:1,roll:0,pins:10,score:0,bs:0,turn:0,over:false};renderBotBowl()}
function renderBotBowl(){let fake={frame:bot.frame,roll:bot.roll,pins:bot.pins,turn:bot.turn,scores:[{name:me,score:bot.score},{name:'البوت',score:bot.bs}]};renderBowling(fake)}
function botBowl(power,aim){if(bot.over||bot.turn)return;let accuracy=Math.max(0,1-Math.abs(aim-50)/50),k=Math.min(bot.pins,Math.max(0,Math.round((power/100*.45+accuracy*.35+Math.random()*.2)*bot.pins)));bot.pins-=k;bot.score+=k;if(bot.pins>0&&bot.roll===0)bot.roll=1;else{bot.roll=0;bot.pins=10;bot.turn=1}renderBotBowl();if(bot.turn)setTimeout(()=>{let k=Math.min(bot.pins,Math.max(0,Math.round((.65+Math.random()*.3)*bot.pins)));bot.pins-=k;bot.bs+=k;if(bot.pins>0&&bot.roll===0)bot.roll=1;else{bot.roll=0;bot.pins=10;bot.turn=0;bot.frame++}if(bot.frame>10){bot.over=true;toast(bot.score>=bot.bs?'🏆 فزت!':'🤖 البوت فاز!')}renderBotBowl()},900)}
function startBotPool(){bot={balls:Array.from({length:10},(_,i)=>({id:i+1,on:true})),score:0,bs:0,turn:0,over:false};renderBotPool()}
function renderBotPool(){let state={score:[{name:me,score:bot.score},{name:'البوت',score:bot.bs}],turn:bot.turn,balls:bot.balls};renderPool(state)}
function botPool(power,angle){if(bot.over||bot.turn)return;let live=bot.balls.filter(b=>b.on);if(!live.length)return;let accuracy=Math.max(.2,Math.min(1,power/100*.65+(1-Math.abs(angle)/180)*.35));if(Math.random()<accuracy){live[Math.floor(Math.random()*live.length)].on=false;bot.score++}bot.turn=1;renderBotPool();if(!bot.balls.some(b=>b.on)){bot.over=true;toast(bot.score>bot.bs?'🏆 فزت!':'🤖 البوت فاز!');return}setTimeout(()=>{let x=bot.balls.filter(b=>b.on);if(x.length&&Math.random()<.82){x[Math.floor(Math.random()*x.length)].on=false;bot.bs++}bot.turn=0;if(!bot.balls.some(b=>b.on)){bot.over=true;toast(bot.score>bot.bs?'🏆 فزت!':'🤖 البوت فاز!')}renderBotPool()},1000)}
function toggleChat(){$('chatPanel').classList.toggle('hidden')}function addEmoji(e){$('chatInput').value+=e;$('chatInput').focus()}function addChat(m){let d=document.createElement('div');d.className='chatMsg '+(m.name===me?'mine':'');d.innerHTML=`<div class="chatName">${esc(m.name)}</div><div>${esc(m.text)}</div>`;$('chatMsgs').appendChild(d);$('chatMsgs').scrollTop=$('chatMsgs').scrollHeight}function sendChat(){let t=$('chatInput').value.trim();if(!t)return;send('chat',{room,text:t});$('chatInput').value=''}connect();
</script></body></html>
